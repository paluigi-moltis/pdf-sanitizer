name: CI

# Runs only on manual dispatch to conserve the GitHub-hosted Actions
# minutes quota. Ordinary pushes are not tested on GitHub; run
# `cargo test --workspace` and the `python/` pytest suite locally on push.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache OCR models
        id: models
        uses: actions/cache@v4
        with:
          path: tests/fixtures/models
          key: ocrs-models-v1

      - name: Download OCR models
        if: steps.models.outputs.cache-hit != 'true'
        run: ./scripts/download-models.sh tests/fixtures/models

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        env:
          PDF_SANITIZER_MODELS_DIR: ${{ github.workspace }}/tests/fixtures/models
        run: cargo test --workspace

  python:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache OCR models
        id: models
        uses: actions/cache@v4
        with:
          path: tests/fixtures/models
          key: ocrs-models-v1

      - name: Download OCR models
        if: steps.models.outputs.cache-hit != 'true'
        run: ./scripts/download-models.sh tests/fixtures/models

      - name: Build extension + CLI
        run: |
          cd python
          uv venv
          uv pip install maturin pytest
          uv run maturin develop --release

      - name: Test
        env:
          PDF_SANITIZER_MODELS_DIR: ${{ github.workspace }}/tests/fixtures/models
        run: |
          cd python
          uv run pytest -v

  web:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl -sSL https://github.com/rustwasm/wasm-pack/releases/download/v0.13.1/wasm-pack-v0.13.1-x86_64-unknown-linux-musl.tar.gz | tar xz -C /tmp && sudo cp /tmp/wasm-pack-v0.13.1-x86_64-unknown-linux-musl/wasm-pack /usr/local/bin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache OCR models
        id: models
        uses: actions/cache@v4
        with:
          path: tests/fixtures/models
          key: ocrs-models-v1

      - name: Download OCR models
        if: steps.models.outputs.cache-hit != 'true'
        run: ./scripts/download-models.sh tests/fixtures/models

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build PWA
        run: |
          cd pwa
          npm install
          npm run build:wasm
          npm run build
