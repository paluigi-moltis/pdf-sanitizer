[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "python", "crates/wasm"]
# `pwa/` (Milestone 3 frontend) is plain JS/TS, not a workspace member.

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/paluigi-moltis/pdf-sanitizer"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lopdf = "0.47"
hayro = { version = "0.9", features = ["embed-fonts"] }
ocrs = "0.14"
rten = "0.28"
clap = { version = "4", features = ["derive"] }
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }

[profile.release]
lto = "thin"
